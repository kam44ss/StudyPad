<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الدفع</title>
<style>
  body {
    margin: 0;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: #faf8f5;
    color: #1c2321;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    max-width: 420px;
    text-align: center;
    padding: 32px 24px;
    border: 1px solid #ddd6cc;
    border-radius: 12px;
    background: white;
  }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #6b6459; font-size: 14px; margin: 0 0 20px; }
  a.btn {
    display: inline-block;
    background: #2f5d50;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon"></div>
    <h1 id="title"></h1>
    <p id="message"></p>
    <a class="btn" href="/">العودة للدروس</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const status = params.get("status");

  const el = { icon: document.getElementById("icon"), title: document.getElementById("title"), message: document.getElementById("message") };

  if (status === "success") {
    el.icon.textContent = "✅";
    el.title.textContent = "تم الدفع بنجاح";
    el.message.textContent = "أصبح بإمكانك مشاهدة الدرس من داخل التطبيق بعد تسجيل الدخول بنفس حسابك.";
  } else if (status === "invalid_signature") {
    el.icon.textContent = "⚠️";
    el.title.textContent = "تعذر التحقق من عملية الدفع";
    el.message.textContent = "لو خُصم مبلغ من حسابك تواصل معنا وسنتحقق يدوياً.";
  } else {
    el.icon.textContent = "❌";
    el.title.textContent = "لم تكتمل عملية الدفع";
    el.message.textContent = "لم يتم خصم أي مبلغ. تقدر تحاول مرة أخرى.";
  }
</script>
</body>
</html>
